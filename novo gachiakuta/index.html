<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gachiakuta: Trash Power</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 400px;
        }
        canvas {
            background: #222;
            border: 4px solid #444;
            image-rendering: pixelated;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        h1 { color: #e74c3c; margin-bottom: 5px; text-shadow: 2px 2px #000; }
        p { margin-bottom: 20px; text-align: center; color: #aaa; }
        button {
            padding: 10px 30px;
            font-size: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        button:hover { background: #c0392b; }
        .stats {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            pointer-events: none;
        }
        span { color: #00ffcc; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="stats">
        LIXO: <span id="trashCount">0</span> | FERAS: <span id="score">0</span>
    </div>

    <div id="menuScreen" class="overlay">
        <h1>GACHIAKUTA</h1>
        <p>Use o poder das luvas para transformar lixo em armas.<br>
        (Setas para mover/pular | Espaço para Atirar)</p>
        <button onclick="startGame()">INICIAR BUSCA</button>
    </div>

    <div id="deathScreen" class="overlay" style="display: none;">
        <h1 style="color: #555;">VOCÊ MORREU...</h1>
        <p>As Feras Maculadas te alcançaram.</p>
        <button onclick="startGame()">TENTAR NOVAMENTE</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 400;

// Estados do Jogo
let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
const gravity = 0.8;
let gameSpeed = 5;

let rudo, trashItems, enemies, bullets, score;

function initVariables() {
    rudo = {
        x: 80,
        y: 300,
        width: 32,
        height: 48,
        dy: 0,
        jumpForce: -14,
        grounded: false,
        trashStored: 0,
        color: "#e74c3c"
    };
    trashItems = [];
    enemies = [];
    bullets = [];
    score = 0;
    updateUI();
}

function updateUI() {
    document.getElementById('trashCount').innerText = rudo.trashStored;
    document.getElementById('score').innerText = score;
}

function startGame() {
    initVariables();
    gameState = 'PLAYING';
    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('deathScreen').style.display = 'none';
}

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function spawnObjects() {
    // Sempre spawna lixo
    if (Math.random() < 0.02) {
        trashItems.push({
            x: canvas.width + 50,
            y: 200 + Math.random() * 150,
            width: 20,
            height: 20
        });
    }

    // SÓ spawna feras se o Rudo já tiver pego algum lixo pelo menos uma vez
    // ou se o score for maior que 0. Isso evita morrer sem munição no início.
    if (rudo.trashStored > 0 || score > 0) {
        if (Math.random() < 0.015) {
            enemies.push({
                x: canvas.width + 100,
                y: 335,
                width: 40,
                height: 45,
                color: "#000"
            });
        }
    }
}

function update() {
    if (gameState !== 'PLAYING') return;

    // Movimento Jogador
    if (!rudo.grounded) rudo.dy += gravity;
    rudo.y += rudo.dy;

    if ((keys['ArrowUp'] || keys['KeyW']) && rudo.grounded) {
        rudo.dy = rudo.jumpForce;
        rudo.grounded = false;
    }

    // Chão
    if (rudo.y + rudo.height > 380) {
        rudo.y = 380 - rudo.height;
        rudo.dy = 0;
        rudo.grounded = true;
    }

    // Ataque
    if (keys['Space'] && rudo.trashStored > 0) {
        bullets.push({ x: rudo.x + rudo.width, y: rudo.y + 20, width: 30, height: 8 });
        rudo.trashStored--;
        updateUI();
        keys['Space'] = false; 
    }

    // Lixo
    trashItems.forEach((t, i) => {
        t.x -= gameSpeed;
        if (rectIntersect(rudo, t)) {
            rudo.trashStored++;
            updateUI();
            trashItems.splice(i, 1);
        }
    });

    // Inimigos
    enemies.forEach((en, i) => {
        en.x -= (gameSpeed + 2);
        if (rectIntersect(rudo, en)) {
            gameState = 'GAMEOVER';
            document.getElementById('deathScreen').style.display = 'flex';
        }
        
        bullets.forEach((b, bi) => {
            if (rectIntersect(b, en)) {
                enemies.splice(i, 1);
                bullets.splice(bi, 1);
                score++;
                updateUI();
            }
        });
    });

    // Balas
    bullets.forEach((b, i) => {
        b.x += 12;
        if (b.x > canvas.width) bullets.splice(i, 1);
    });

    spawnObjects();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Chão decorativo
    ctx.fillStyle = "#333";
    ctx.fillRect(0, 380, canvas.width, 20);

    if (gameState === 'MENU') return;

    // Rudo
    ctx.fillStyle = rudo.color;
    ctx.fillRect(rudo.x, rudo.y, rudo.width, rudo.height);
    ctx.fillStyle = "#fff"; // Luvas
    ctx.fillRect(rudo.x + 22, rudo.y + 20, 12, 12);

    // Lixo (Icone Marrom com borda)
    trashItems.forEach(t => {
        ctx.fillStyle = "#8b5a2b";
        ctx.fillRect(t.x, t.y, t.width, t.height);
        ctx.strokeStyle = "#d2b48c";
        ctx.strokeRect(t.x, t.y, t.width, t.height);
    });

    // Feras (Pretas com olhos roxos)
    enemies.forEach(en => {
        ctx.fillStyle = "#000";
        ctx.fillRect(en.x, en.y, en.width, en.height);
        ctx.fillStyle = "#a020f0"; 
        ctx.fillRect(en.x + 8, en.y + 12, 6, 6);
        ctx.fillRect(en.x + 25, en.y + 12, 6, 6);
    });

    // Balas (Lixo energizado)
    bullets.forEach(b => {
        ctx.fillStyle = "#00ffcc";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#00ffcc";
        ctx.fillRect(b.x, b.y, b.width, b.height);
        ctx.shadowBlur = 0;
    });
}

function rectIntersect(r1, r2) {
    return !(r2.x > r1.x + r1.width || r2.x + r2.width < r1.x || 
             r2.y > r1.y + r1.height || r2.y + r2.height < r1.y);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>

</html>
